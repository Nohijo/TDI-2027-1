spring.application.name=libreria-spring-boot

# 8080 suele estar ocupado por el Tomcat de las otras practicas.
server.port=8081
# Sesion solo por cookie, sin ";jsessionid=" en las URL.
server.servlet.session.tracking-modes=cookie

# Vistas JSP (src/main/webapp/WEB-INF/jsp).
spring.mvc.view.prefix=/WEB-INF/jsp/
spring.mvc.view.suffix=.jsp

# Base de datos (la crea esquema.sql).
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:3306/libreria_online?useSSL=false&allowPublicKeyRetrieval=true&characterEncoding=UTF-8
spring.datasource.username=libreria_app
spring.datasource.password=libreria_pass
# Si MySQL esta apagado, avisar en 3 segundos en vez de los 30 por omision.
spring.datasource.hikari.connection-timeout=3000
